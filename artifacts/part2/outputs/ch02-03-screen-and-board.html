<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ch02-03. 화면 구조와 보드 읽는 법</title>
    <!-- 허용된 외부 의존은 아래 웹폰트 2개뿐. 그 외 모든 것은 인라인/로컬 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/webfontworld/gmarket/GmarketSans.css"
    />
    <style>
      :root {
        --bg: #0d1117;
        --bg-card: #161b22;
        --bg-code: #1e2430;
        --bg-inset: #252d3a;
        --text: #e6edf3;
        --text-dim: #8b949e;
        --text-muted: #484f58;
        --brand: #fc1c49; /* 패스트캠퍼스 시그니처 레드 — 덱의 기본 강조색 */
        --brand-rgb: 252, 28, 73;
        --orange: #ff6d3b;
        --yellow: #f0b429;
        --purple: #9188ff;
        --green: #4ade80;
        --gray: #8b949e;
        --border: rgba(255, 255, 255, 0.08);
        --border-brand: rgba(var(--brand-rgb), 0.3);
        --border-orange: rgba(255, 109, 59, 0.25);
        --border-purple: rgba(145, 136, 255, 0.28);
        --border-yellow: rgba(240, 180, 41, 0.28);
        --border-green: rgba(74, 222, 128, 0.25);
        --border-gray: rgba(139, 148, 158, 0.22);
        --dot: rgba(255, 255, 255, 0.055);
        --ease: 0.36s cubic-bezier(0.4, 0, 0.2, 1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        font-family:
          "Pretendard",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        font-size: clamp(13px, 1.35vw, 16px); /* 기준 덱과 동일 — 이보다 낮추지 않는다 */
        background: var(--bg);
        color: var(--text);
        word-break: keep-all; /* 한국어 어절 단위 줄바꿈 */
      }
      body {
        overflow: hidden;
      }

      .slide-deck {
        position: fixed;
        inset: 0;
      }

      .slide {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          circle,
          var(--dot) 1px,
          transparent 1px
        );
        background-size: 26px 26px;
        background-color: var(--bg);
        display: grid;
        grid-template-rows: auto 1fr auto;
        /* 좌우 여백을 키우면 본문이 좁아져 모든 게 작아 보인다. 7.5vw/7rem을 넘기지 않는다 */
        padding: clamp(2.6rem, 5.5vh, 4.2rem) clamp(4rem, 7.5vw, 7rem);
        gap: clamp(1.5rem, 3.75vh, 3rem);
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--ease);
      }
      .slide.active {
        opacity: 1;
        pointer-events: auto;
      }

      /* ── 공통 헤더 / 푸터 ─────────────────────────────────── */
      .slide__header {
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
        padding-bottom: clamp(0.9rem, 2.2vh, 1.6rem);
        border-bottom: 1px solid var(--border);
      }
      .slide__label {
        font-size: clamp(0.58rem, 0.85vw, 0.72rem);
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--brand);
      }
      .slide__title {
        font-size: clamp(2rem, 5.2vw, 3.8rem);
        font-weight: 800;
        line-height: 1.08;
        letter-spacing: -0.015em;
      }
      .slide__title .hl {
        color: var(--brand);
      }
      .slide__title .hl-orange {
        color: var(--orange);
      }
      .slide__title .hl-yellow {
        color: var(--yellow);
      }
      .slide__title .hl-purple {
        color: var(--purple);
      }
      .slide__sub {
        font-size: clamp(1.05rem, 1.6vw, 1.28rem);
        font-weight: 400;
        color: var(--text-dim);
        line-height: 1.5;
      }

      .slide__body {
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: clamp(1.2rem, 2.7vh, 2.1rem);
        min-height: 0;
        justify-content: center;
      }
      .slide__body > .grid-3 {
        flex: 0 0 auto;
        align-items: stretch;
      }
      .slide__body > .grid-2 {
        flex: 0 0 auto;
      }
      .slide__body > .timeline {
        width: 100%;
        align-self: center;
      }

      .slide__footer {
        border-top: 1px solid var(--border);
        padding-top: clamp(0.5rem, 1.3vh, 0.9rem);
        display: flex;
        align-items: center;
        font-size: clamp(0.58rem, 0.85vw, 0.7rem);
        font-weight: 400;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-muted);
      }
      /* 모든 슬라이드 푸터는 패스트캠퍼스 로고 하나다 — 텍스트를 넣지 않는다 */
      .fastcampus-logo {
        display: block;
        width: clamp(7.2rem, 9vw, 8.5rem);
        height: auto;
      }

      /* ══════════════════════════════════════════════════════════
         시각 장치 — 기준 덱(hermes-bot · orca-competition-pattern)에서 가져온 것.
         **거의 모든 슬라이드에 이 중 하나가 들어가야 한다.** 기준 덱은 12장 중
         11장에 이미지나 SVG가 있다. 글자만 있는 장을 연속으로 두지 않는다.
      ══════════════════════════════════════════════════════════ */

      /* 큰 설명 이미지 — 본문 높이를 실제로 쓴다. 작게 넣지 않는다 */
      .illustration-frame {
        width: min(48rem, 100%);
        align-self: center;
        overflow: hidden;
        border: 1px solid var(--border-brand);
        border-radius: 10px;
        background: rgba(var(--brand-rgb), 0.035);
      }
      .illustration-frame img {
        display: block;
        width: 100%;
        height: clamp(15rem, 38vh, 22rem);
        object-fit: cover;
        object-position: center;
      }
      /* 여백이 이미 있는 그림(로고·다이어그램)은 잘라내지 않고 담는다 */
      .illustration-frame--contain {
        width: auto;
        border-color: var(--border-gray);
        background: rgba(139, 148, 158, 0.05);
      }
      .illustration-frame--contain img {
        width: auto;
        max-width: 100%;
        object-fit: contain;
      }

      /* 이미지가 남는 본문 높이를 전부 먹는 변형 — 그림이 주인공인 장 */
      .slide--visual .slide__body {
        justify-content: stretch;
        gap: 0;
      }
      .slide--visual .illustration-frame {
        flex: 1 1 auto;
        min-height: 0;
      }
      .slide--visual .illustration-frame img {
        width: 100%;
        height: 100%;
      }
      .slide--visual .statement {
        margin-top: clamp(1.25rem, 2.8vh, 2rem);
      }

      /* 이미지 주도 표지 — 이미지가 본문 전체를 채우고 글자를 그 위에 얹는다.
         이미지 안에 네거티브 스페이스가 있으면 별도 텍스트 열을 만들지 않는다 */
      .cover-hero {
        position: relative;
        width: 100%;
        height: 100%;
        align-self: center;
        overflow: hidden;
        border: 1px solid var(--border-brand);
        border-radius: 12px;
        background: rgba(var(--brand-rgb), 0.04);
        box-shadow: 0 1.6rem 4.5rem rgba(0, 0, 0, 0.34);
      }
      .cover-hero img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cover-hero__copy {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: clamp(0.6rem, 1.4vh, 1rem);
        padding: clamp(1.6rem, 4vw, 3.4rem);
      }

      /* SVG 커넥터 — 분기·합류선을 손으로 CSS 계산하지 말고 이걸 쓴다.
         non-scaling-stroke라 폭이 변해도 선 두께가 유지된다 */
      .svg-connectors {
        display: block;
        width: 78%;
        height: clamp(2.5rem, 5.5vh, 3.6rem);
        overflow: visible;
        align-self: center;
      }
      .svg-connectors path {
        fill: none;
        stroke: var(--border-brand);
        stroke-width: 1.8;
        vector-effect: non-scaling-stroke;
      }
      .svg-connectors--gray path { stroke: var(--border-gray); }
      .svg-connectors--orange path { stroke: var(--border-orange); }

      /* 로고 — 제품을 가르치는 덱이라 로고가 자주 나온다. 작게 넣지 않는다 */
      .logo {
        width: clamp(4.5rem, 7vw, 6.3rem);
        height: clamp(4.5rem, 7vw, 6.3rem);
        object-fit: contain;
      }
      .logo--small {
        width: clamp(2.8rem, 4vw, 3.7rem);
        height: clamp(2.8rem, 4vw, 3.7rem);
      }
      .logo--wide {
        width: clamp(8rem, 14vw, 12rem);
        height: clamp(5rem, 9vw, 7.5rem);
      }

      /* 로고·그림을 담는 카드. min-height로 높이를 먼저 확보한다 */
      .media-card {
        min-width: 0;
        min-height: clamp(9rem, 20vh, 12.5rem);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(0.5rem, 1.2vh, 0.85rem);
        padding: clamp(1.1rem, 2.2vw, 1.7rem);
        border: 1.5px solid var(--border);
        border-radius: 10px;
        background: var(--bg-card);
        text-align: center;
      }
      .media-card--brand  { border-color: var(--border-brand);  background: rgba(var(--brand-rgb), 0.05); }
      .media-card--purple { border-color: var(--border-purple); background: rgba(145, 136, 255, 0.05); }
      .media-card--yellow { border-color: var(--border-yellow); background: rgba(240, 180, 41, 0.05); }
      .media-card--green  { border-color: var(--border-green);  background: rgba(74, 222, 128, 0.05); }
      .media-card--gray   { border-color: var(--border-gray);   background: rgba(139, 148, 158, 0.05); }
      .media-card--tall   { min-height: clamp(14rem, 32vh, 18rem); }

      /* 큰 본문 타이포 — 기준 덱은 본문도 1.4rem까지 간다. 작게 쓰지 않는다 */
      .name {
        font-size: clamp(1.35rem, 2.1vw, 1.85rem);
        font-weight: 800;
        line-height: 1.16;
      }
      .body-copy {
        color: var(--text-dim);
        font-size: clamp(1.16rem, 1.75vw, 1.42rem);
        line-height: 1.45;
      }
      .file-name {
        font-family: "Monaco", "Menlo", monospace;
        font-size: clamp(1rem, 1.55vw, 1.25rem);
        font-weight: 700;
        color: var(--text);
      }
      .statement {
        align-self: center;
        font-size: clamp(1.3rem, 2vw, 1.65rem);
        font-weight: 800;
        color: var(--text);
        text-align: center;
        line-height: 1.4;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        align-self: center;
        gap: 0.5rem;
        padding: clamp(0.48rem, 0.9vh, 0.7rem) clamp(1rem, 1.7vw, 1.45rem);
        border: 1px solid var(--border);
        border-radius: 4px;
        font-family: "Monaco", "Menlo", monospace;
        font-size: clamp(0.8rem, 1.15vw, 0.98rem);
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--text-dim);
      }
      .badge--brand  { color: var(--brand);  border-color: var(--border-brand);  background: rgba(var(--brand-rgb), 0.08); }
      .badge--orange { color: var(--orange); border-color: var(--border-orange); background: rgba(255, 109, 59, 0.08); }
      .badge--green  { color: var(--green);  border-color: var(--border-green);  background: rgba(74, 222, 128, 0.08); }

      /* ── 공통 타이포 ──────────────────────────────────────── */
      .display {
        font-family: "GmarketSans", "Pretendard", sans-serif;
        font-size: clamp(2.8rem, 7vw, 5.5rem);
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.03em;
      }
      .caption {
        font-size: clamp(0.9rem, 1.45vw, 1.15rem);
        line-height: 1.5;
        color: var(--text-dim);
      }
      .kw-brand {
        color: var(--brand);
      }
      .kw-orange {
        color: var(--orange);
        font-weight: 600;
      }
      .kw-yellow {
        color: var(--yellow);
        font-weight: 600;
      }
      .kw-purple {
        color: var(--purple);
      }

      code {
        font-family: "Monaco", "Menlo", "Consolas", monospace;
        font-size: 0.85em;
        background: rgba(var(--brand-rgb), 0.1);
        color: var(--brand);
        padding: 2px 6px;
        border-radius: 3px;
      }

      /* ── 불릿 리스트 (✓/✕) ───────────────────────────────── */
      .bullet-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
      }
      .bullet-list li {
        display: flex;
        align-items: baseline;
        gap: 0.9rem;
        font-size: clamp(0.95rem, 1.5vw, 1.2rem);
        line-height: 1.55;
      }
      .bullet-list li.no::before {
        content: "✕";
        color: var(--orange);
        font-weight: 700;
        flex-shrink: 0;
      }
      .bullet-list li.ok::before {
        content: "✓";
        color: var(--green);
        font-weight: 700;
        flex-shrink: 0;
      }
      .bullet-list li.no {
        color: var(--text-dim);
      }

      /* ── tip: 슬라이드 하단 한 줄 정리 ────────────────────── */
      .tip {
        background: rgba(var(--brand-rgb), 0.05);
        border: 1px solid rgba(var(--brand-rgb), 0.18);
        border-radius: 3px;
        padding: 0.975rem 1.5rem;
        font-size: clamp(0.95rem, 1.4vw, 1.15rem);
        color: var(--text-dim);
        line-height: 1.6;
      }
      .tip::before {
        content: "→  ";
        color: var(--brand);
        font-weight: 700;
      }
      .tip--yellow {
        background: rgba(240, 180, 41, 0.05);
        border-color: rgba(240, 180, 41, 0.22);
      }
      .tip--yellow::before {
        color: var(--yellow);
      }

      /* ── TEXT(표지) — cover ───────────────────────────────── */
      .cover-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: clamp(1.1rem, 2.6vh, 2rem);
      }
      .cover-emoji {
        font-size: clamp(3.6rem, 9vw, 7rem);
        line-height: 1;
      }
      .cover-stmt {
        font-family: "GmarketSans", "Pretendard", sans-serif;
        font-size: clamp(2.4rem, 4.5vw, 3.9rem);
        font-weight: 900;
        line-height: 1.3;
        letter-spacing: -0.025em;
      }
      .cover-axis {
        display: flex;
        align-items: center;
        gap: clamp(0.6rem, 1.4vw, 1.1rem);
        font-family: "Monaco", "Menlo", monospace;
        font-size: clamp(0.7rem, 1.1vw, 0.9rem);
        letter-spacing: 0.1em;
        color: var(--text-muted);
        text-transform: uppercase;
      }
      .cover-axis b {
        color: var(--brand);
        font-weight: 700;
      }

      /* ── COVER(표지) — cover-frame: 클립 정체 + 이 클립에서 배우는 것 3개 + 시각 1점 ── */
      .cover-frame {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
        gap: clamp(2rem, 4.5vw, 4rem);
        align-items: center;
      }
      .learn {
        display: flex;
        flex-direction: column;
        gap: clamp(0.8rem, 1.9vh, 1.3rem);
        min-width: 0;
      }
      .learn__label {
        display: flex;
        align-items: baseline;
        gap: 0.7rem;
        font-family: "Monaco", "Menlo", monospace;
        font-size: clamp(0.6rem, 0.88vw, 0.74rem);
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--brand);
      }
      .learn__label span {
        font-family: "Pretendard", sans-serif;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: none;
        font-size: clamp(0.82rem, 1.2vw, 1rem);
        color: var(--text-dim);
      }
      .learn-item {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: clamp(0.9rem, 1.6vw, 1.3rem);
        align-items: start;
        padding-bottom: clamp(0.7rem, 1.6vh, 1.1rem);
        border-bottom: 1px solid var(--border);
      }
      .learn-item:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }
      .learn-item__num {
        font-family: "GmarketSans", "Pretendard", sans-serif;
        font-weight: 900;
        font-size: clamp(1.5rem, 2.6vw, 2.2rem);
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--brand);
        padding-top: 0.12em;
        min-width: 1.6em;
      }
      .learn-item__title {
        font-size: clamp(1.15rem, 1.9vw, 1.5rem);
        font-weight: 800;
        line-height: 1.25;
        letter-spacing: -0.015em;
      }
      .learn-item__sub {
        margin-top: 0.3rem;
        font-size: clamp(0.9rem, 1.3vw, 1.08rem);
        line-height: 1.45;
        color: var(--text-dim);
      }
      .cover-frame__visual {
        margin: 0;
        min-width: 0;
        overflow: hidden;
        border-radius: 10px;
        border: 1px solid var(--border-gray);
        background: rgba(139, 148, 158, 0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        height: clamp(15rem, 42vh, 24rem);
      }
      .cover-frame__visual img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      /* 장면 이미지가 없는 클립 — 로고 카드 2장으로 시각 1점을 채운다 */
      .cover-frame__visual--cards {
        border: 0;
        background: none;
        overflow: visible;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: clamp(0.8rem, 1.6vw, 1.2rem);
        align-items: stretch;
      }
      .cover-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--bg-card);
        padding: 1rem;
      }
      .cover-card--brand  { border-color: var(--border-brand);  background: rgba(var(--brand-rgb), 0.05); }
      .cover-card--purple { border-color: var(--border-purple); background: rgba(145, 136, 255, 0.05); }
      .cover-card img {
        width: clamp(4.5rem, 7vw, 6.3rem);
        height: clamp(4.5rem, 7vw, 6.3rem);
        object-fit: contain;
      }
      .cover-card b {
        font-size: clamp(1.15rem, 1.8vw, 1.5rem);
        font-weight: 800;
      }

      /* ── CARD_GRID — grid-3 + col-card ────────────────────── */
      .grid-3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: clamp(1.2rem, 3vw, 2.1rem);
      }
      .col-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: clamp(1.5rem, 2.7vw, 2.25rem);
        display: flex;
        flex-direction: column;
        gap: 1.1rem;
      }
      .col-card__title-row {
        display: flex;
        align-items: center;
        gap: 0.7rem;
      }
      .col-card__emoji {
        font-size: clamp(1.5rem, 2.4vw, 2rem);
        line-height: 1;
        flex-shrink: 0;
      }
      .col-card__title {
        font-size: clamp(1.4rem, 2.8vw, 2rem);
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      .col-card__body {
        font-size: clamp(0.88rem, 1.35vw, 1.08rem);
        line-height: 1.55;
        color: var(--text-dim);
      }
      .col-card--brand {
        border-color: var(--border-brand) !important;
        background: rgba(var(--brand-rgb), 0.05);
      }
      .col-card--orange {
        border-color: var(--border-orange) !important;
        background: rgba(255, 109, 59, 0.05);
      }
      .col-card--purple {
        border-color: var(--border-purple) !important;
        background: rgba(145, 136, 255, 0.05);
      }
      .col-card--gray {
        border-color: var(--border-gray) !important;
        background: rgba(139, 148, 158, 0.05);
      }
      /* 변형: 카드 6장(3열 2행)일 때 — grid-3에 함께 붙인다 */
      .grid-3--tight {
        gap: clamp(0.9rem, 1.8vw, 1.5rem);
      }
      .grid-3--tight .col-card {
        padding: clamp(1rem, 1.9vw, 1.5rem);
        gap: 0.7rem;
      }
      .grid-3--tight .col-card__title {
        font-size: clamp(1.1rem, 2vw, 1.5rem);
        font-family: "Monaco", "Menlo", monospace;
        letter-spacing: -0.01em;
      }
      .grid-3--tight .col-card__emoji {
        font-size: clamp(1.2rem, 2vw, 1.6rem);
      }
      /* 변형: 설명이 긴 카드 6장 — 높이·패딩·타이포를 줄이지 않는다 */
      .grid-3--spacious {
        min-height: clamp(24rem, 52vh, 30rem);
        gap: clamp(1rem, 2vw, 1.6rem);
      }
      .grid-3--spacious .col-card {
        justify-content: center;
        padding: clamp(1.35rem, 2.2vw, 1.85rem);
        gap: clamp(0.85rem, 1.7vh, 1.15rem);
      }
      .grid-3--spacious .col-card__title {
        font-size: clamp(1.2rem, 1.85vw, 1.55rem);
      }
      .grid-3--spacious .col-card__body {
        font-size: clamp(0.96rem, 1.3vw, 1.1rem);
        line-height: 1.55;
      }
      /* 변형: 카드 상단 정체 배지 (역할·소속 구분) */
      .role-badge {
        align-self: flex-start;
        font-family: "Monaco", "Menlo", monospace;
        font-size: clamp(0.66rem, 1vw, 0.8rem);
        font-weight: 700;
        letter-spacing: 0.08em;
        padding: 0.32rem 0.7rem;
        border-radius: 3px;
        border: 1px solid var(--border);
      }
      .role-badge--brand {
        color: var(--brand);
        border-color: var(--border-brand);
        background: rgba(var(--brand-rgb), 0.08);
      }
      .role-badge--purple {
        color: var(--purple);
        border-color: var(--border-purple);
        background: rgba(145, 136, 255, 0.08);
      }
      .role-badge--gray {
        color: var(--gray);
        border-color: var(--border-gray);
        background: rgba(139, 148, 158, 0.08);
      }
      .role-sub {
        font-family: "Monaco", "Menlo", monospace;
        font-size: clamp(0.7rem, 1.05vw, 0.85rem);
        color: var(--text-muted);
        letter-spacing: 0.03em;
      }

      /* ── 좌우 2분할 — grid-2 · vs-grid(대비 비교) ─────────── */
      .grid-2 {
        display: grid;
        grid-template-columns: 1.05fr 1fr;
        gap: clamp(1.5rem, 3.5vw, 2.8rem);
        align-items: center;
      }
      .vs-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: clamp(1.2rem, 3vw, 2.4rem);
        width: 100%;
      }
      .vs-col {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: clamp(1.2rem, 2.4vw, 2rem);
        display: flex;
        flex-direction: column;
        gap: clamp(0.8rem, 1.8vh, 1.3rem);
      }
      .vs-col--blocked {
        border-color: var(--border-orange);
        background: rgba(255, 109, 59, 0.04);
      }
      .vs-col--pass {
        border-color: var(--border-brand);
        background: rgba(var(--brand-rgb), 0.05);
      }
      .vs-badge {
        align-self: flex-start;
        font-family: "Monaco", "Menlo", monospace;
        font-size: clamp(0.64rem, 1vw, 0.78rem);
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 0.3rem 0.65rem;
        border-radius: 3px;
        border: 1px solid var(--border);
      }
      .vs-badge--blocked {
        color: var(--orange);
        border-color: var(--border-orange);
        background: rgba(255, 109, 59, 0.08);
      }
      .vs-badge--pass {
        color: var(--brand);
        border-color: var(--border-brand);
        background: rgba(var(--brand-rgb), 0.08);
      }
      .vs-headline {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        font-size: clamp(1.35rem, 2.7vw, 2.1rem);
        font-weight: 800;
        line-height: 1.2;
        letter-spacing: -0.015em;
      }
      .vs-headline span {
        font-size: clamp(1.5rem, 2.7vw, 2.1rem);
        line-height: 1;
        flex-shrink: 0;
      }
      .vs-col--blocked .vs-headline {
        color: var(--orange);
      }
      .vs-col--pass .vs-headline {
        color: var(--brand);
      }

      /* ── LIST — 번호 원 + 제목 + 부연 나열 (카드 박스 없음) ── */
      .list {
        display: flex;
        flex-direction: column;
        gap: clamp(2.4rem, 7vh, 5.5rem);
        align-self: center;
        width: min(52rem, 100%);
      }
      .list-item {
        display: flex;
        align-items: flex-start;
        gap: clamp(1rem, 2vw, 1.6rem);
      }
      .list-item.num {
        align-items: center;
      }
      .list-num {
        width: clamp(3.2rem, 5.5vw, 4.6rem);
        height: clamp(3.2rem, 5.5vw, 4.6rem);
        flex-shrink: 0;
        border-radius: 50%;
        border: 1.5px solid var(--text);
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Monaco", "Menlo", monospace;
        font-size: clamp(1.1rem, 1.9vw, 1.5rem);
        font-weight: 700;
        color: var(--text);
      }
      /* 변형: 번호 대신 점 마커 (순서 없는 나열) */
      .list-dot {
        width: clamp(0.75rem, 1.1vw, 0.95rem);
        height: clamp(0.75rem, 1.1vw, 0.95rem);
        margin-top: 0.55em;
        border-radius: 50%;
        background: var(--text);
        flex-shrink: 0;
      }
      .list-body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: clamp(0.3rem, 0.8vh, 0.55rem);
      }
      .list-title {
        font-size: clamp(1.3rem, 2.5vw, 1.95rem);
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }
      .list-sub {
        font-size: clamp(0.95rem, 1.5vw, 1.2rem);
        color: var(--text-dim);
        line-height: 1.45;
      }

      /* ── ICON_ROW — timeline (가로 파이프라인) ────────────── */
      .timeline {
        display: grid;
        /* 카드 5장 기준. 카드 수가 다르면 timeline--4 처럼 columns를 맞춘다 */
        grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr auto 1fr;
        gap: 0;
        align-items: stretch;
      }
      .timeline--4 {
        grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr;
      }
      .timeline--3 {
        grid-template-columns: 1fr auto 1fr auto 1fr;
      }
      .timeline-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: clamp(1rem, 1.9vw, 1.6rem) clamp(0.6rem, 1.2vw, 1rem);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(0.6rem, 1.5vh, 1.1rem);
        text-align: center;
        justify-content: flex-start;
      }
      .timeline-card--plain {
        border-color: var(--border);
      }
      .timeline-card--gray {
        border-color: var(--border-gray);
        background: rgba(139, 148, 158, 0.06);
      }
      .timeline-card--brand {
        border-color: var(--border-brand);
        background: rgba(var(--brand-rgb), 0.07);
      }
      .timeline-card--purple {
        border-color: var(--border-purple);
        background: rgba(145, 136, 255, 0.07);
      }
      .timeline-card--yellow {
        border-color: var(--border-yellow);
        background: rgba(240, 180, 41, 0.08);
      }
      .timeline-card--orange {
        border-color: var(--border-orange);
        background: rgba(255, 109, 59, 0.08);
      }
      .timeline-card--green {
        border-color: var(--border-green);
        background: rgba(74, 222, 128, 0.08);
      }
      .timeline-card__step {
        font-family: "Monaco", "Menlo", monospace;
        font-size: clamp(0.62rem, 0.95vw, 0.8rem);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        padding: 0.3rem 0.7rem;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.04);
      }
      .step--gray {
        color: var(--gray);
      }
      .step--brand {
        color: var(--brand);
      }
      .step--purple {
        color: var(--purple);
      }
      .step--yellow {
        color: var(--yellow);
      }
      .step--orange {
        color: var(--orange);
      }
      .step--green {
        color: var(--green);
      }
      .step--muted {
        color: var(--text-dim);
      }
      .timeline-emoji-wrap {
        width: clamp(4.2rem, 8.5vw, 7rem);
        height: clamp(4.2rem, 8.5vw, 7rem);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.03);
        border: 1.5px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .timeline-emoji-wrap span {
        font-size: clamp(1.9rem, 4vw, 3.2rem);
        line-height: 1;
      }
      .timeline-card__title {
        font-size: clamp(1.15rem, 2.1vw, 1.7rem);
        font-weight: 700;
        line-height: 1.2;
      }
      .timeline-card__body {
        font-size: clamp(0.82rem, 1.25vw, 1.02rem);
        line-height: 1.5;
        color: var(--text-dim);
      }
      .timeline-arrow {
        position: relative;
        flex-shrink: 0;
        width: clamp(1.4rem, 2.6vw, 2.4rem);
        height: clamp(1rem, 2vh, 1.5rem);
        align-self: center;
      }
      .timeline-arrow::before {
        content: "";
        position: absolute;
        left: 10%;
        right: 28%;
        top: 50%;
        height: 2px;
        background: var(--border-purple);
        transform: translateY(-50%);
      }
      .timeline-arrow::after {
        content: "";
        position: absolute;
        right: 10%;
        top: 50%;
        border-top: 0.36rem solid transparent;
        border-bottom: 0.36rem solid transparent;
        border-left: 0.5rem solid var(--purple);
        transform: translateY(-50%);
      }
      .flow-quote {
        color: var(--text);
        font-style: normal;
      }

      /* ── TREE — fan (부모 1 → 자식 여럿) ──────────────────── */
      .fan {
        --fan-gap: clamp(1.5rem, 4vw, 3rem);
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(58rem, 100%);
        align-self: center;
      }
      .fan-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: clamp(1rem, 2vw, 1.6rem) clamp(1.2rem, 2.4vw, 2rem);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        text-align: center;
      }
      .fan-card--brand {
        border-color: var(--border-brand);
        background: rgba(var(--brand-rgb), 0.06);
      }
      .fan-card--purple {
        border-color: var(--border-purple);
        background: rgba(145, 136, 255, 0.06);
      }
      .fan-card--orange {
        border-color: var(--border-orange);
        background: rgba(255, 109, 59, 0.06);
      }
      .fan-card__emoji {
        font-size: clamp(1.8rem, 3.4vw, 2.8rem);
        line-height: 1;
      }
      .fan-card__title {
        font-size: clamp(1.2rem, 2.2vw, 1.75rem);
        font-weight: 700;
        line-height: 1.2;
      }
      .fan-card__body {
        font-size: clamp(0.85rem, 1.3vw, 1.05rem);
        color: var(--text-dim);
        line-height: 1.5;
      }
      .fan-root {
        width: clamp(14rem, 26vw, 20rem);
      }
      .fan-stem {
        width: 2px;
        height: clamp(1.4rem, 3vh, 2.4rem);
        background: var(--border-brand);
      }
      .fan-bar-wrap {
        width: 100%;
        display: flex;
        justify-content: center;
      }
      .fan-bar {
        position: relative;
        /* 자식 카드의 중심과 세로선을 맞춘다 (열 중심 간격 = 50% + gap/2) */
        width: calc(50% + var(--fan-gap) / 2);
        height: 2px;
        background: var(--border-brand);
      }
      .fan-bar::before,
      .fan-bar::after {
        content: "";
        position: absolute;
        top: 0;
        width: 2px;
        height: clamp(1.4rem, 3vh, 2.4rem);
        background: var(--border-brand);
      }
      .fan-bar::before {
        left: 0;
      }
      .fan-bar::after {
        right: 0;
      }
      .fan-kids {
        margin-top: clamp(1.4rem, 3vh, 2.4rem);
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--fan-gap);
      }

      /* ── METRIC — 대형 수치 (소스에 실제 수치가 있을 때만) ── */
      .metric-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: clamp(1.2rem, 3vw, 2.4rem);
      }
      .metric {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(0.55rem, 1.3vh, 0.95rem);
        padding: clamp(1.6rem, 3.4vh, 2.6rem) clamp(1rem, 2vw, 1.6rem);
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg-card);
      }
      .metric--star {
        border-color: var(--border-yellow);
        background: rgba(240, 180, 41, 0.06);
      }
      .metric__icon {
        font-size: clamp(1.6rem, 3vw, 2.4rem);
        line-height: 1;
        margin-bottom: clamp(0.3rem, 0.9vh, 0.7rem);
      }
      .metric__num {
        font-family: "GmarketSans", "Pretendard", sans-serif;
        font-size: clamp(2.6rem, 6.5vw, 5rem);
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.03em;
      }
      .metric--star .metric__num {
        color: var(--yellow);
      }
      .metric__cap {
        font-size: clamp(0.8rem, 1.2vw, 1rem);
        color: var(--text-dim);
      }

      /* ── 이번 덱 전용 변형 — 화면 위치 도식과 대기 색 ─────
         .ui-map    : 창 하나를 축소해 그리고 "지금 말하는 자리" 한 칸만 켠다.
                      1번은 세로 3분할 중 한 칸, 4번은 목록 줄 하나를 켠다.
                      두 슬라이드가 같은 창 그림을 쓰므로 위치가 말 없이 이어진다.
         .vs-col--waiting / .vs-badge--waiting
                    : 템플릿에 없는 yellow(내 결정 대기) 색 변형. 구조는 그대로 쓴다.
      ─────────────────────────────────────────────────────── */
      .ui-map {
        display: block;
        align-self: center;
        width: 100%;
        max-width: clamp(10rem, 18vw, 14rem);
        height: auto;
      }
      .ui-map--lg {
        max-width: clamp(13rem, 23vw, 18rem);
      }
      .ui-map__frame {
        fill: rgba(255, 255, 255, 0.02);
        stroke: var(--border);
        stroke-width: 1.5;
        vector-effect: non-scaling-stroke;
      }
      .ui-map__bar {
        fill: none;
        stroke: var(--border);
        stroke-width: 1.5;
        vector-effect: non-scaling-stroke;
      }
      .ui-map__pane,
      .ui-map__row {
        fill: rgba(255, 255, 255, 0.05);
      }
      .ui-map__pane--on,
      .ui-map__row--on {
        fill: var(--map-on);
      }
      .ui-map--gray { --map-on: rgba(139, 148, 158, 0.55); }
      .ui-map--brand { --map-on: rgba(var(--brand-rgb), 0.6); }
      .ui-map--green { --map-on: rgba(74, 222, 128, 0.55); }
      .ui-map--yellow { --map-on: rgba(240, 180, 41, 0.6); }
      .ui-map--orange { --map-on: rgba(255, 109, 59, 0.6); }

      .vs-col--waiting {
        border-color: var(--border-yellow);
        background: rgba(240, 180, 41, 0.05);
      }
      .vs-col--waiting .vs-headline {
        color: var(--yellow);
      }
      .vs-badge--waiting {
        color: var(--yellow);
        border-color: var(--border-yellow);
        background: rgba(240, 180, 41, 0.08);
      }

      /* 국소 크기 조정 — 다른 장의 공통 클래스를 건드리지 않는다 */
      .split-list {
        width: 100%;
        gap: clamp(1.4rem, 3.2vh, 2.4rem);
      }
      .illustration-frame--full {
        width: 100%;
      }

      /* ── Navigation ───────────────────────────────────────── */
      .progress-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        z-index: 200;
        background: rgba(255, 255, 255, 0.04);
        user-select: none;
      }
      .progress-fill {
        height: 100%;
        background: var(--brand);
        transition: width 0.3s ease-out;
      }
      .nav-btn {
        position: fixed;
        top: 50%;
        z-index: 150;
        transform: translateY(-50%);
        user-select: none;
        width: clamp(1.9rem, 2.8vw, 2.5rem);
        height: clamp(1.9rem, 2.8vw, 2.5rem);
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        border-radius: 3px;
        color: var(--text-muted);
        font-size: 0.8rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
      }
      .nav-btn:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
      }
      .nav-btn:disabled {
        opacity: 0.08;
        cursor: not-allowed;
      }
      #btn-prev {
        left: clamp(0.4rem, 1.2vw, 1.1rem);
      }
      #btn-next {
        right: clamp(0.4rem, 1.2vw, 1.1rem);
      }
      .dot-nav {
        position: fixed;
        bottom: 1.3rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 150;
        display: flex;
        gap: 5px;
        align-items: center;
        user-select: none;
      }
      .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        cursor: pointer;
        border: none;
        transition: all 0.22s ease;
      }
      .dot.active {
        width: 22px;
        border-radius: 3px;
        background: var(--brand);
      }
      .slide-counter {
        position: fixed;
        bottom: 1.2rem;
        right: 1.8rem;
        z-index: 150;
        font-family: "Monaco", monospace;
        font-size: 0.62em;
        color: var(--text-muted);
        letter-spacing: 0.07em;
        user-select: none;
      }

      /* ── Animations ───────────────────────────────────────── */
      @keyframes s-fadeInUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .anim-item {
        opacity: 0;
      }
      .anim-item.do-fadeinup {
        animation: s-fadeInUp 0.48s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
    </style>
  </head>
  <body>
    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>
    <button class="nav-btn" id="btn-prev" aria-label="이전 슬라이드">
      &#8592;
    </button>
    <button class="nav-btn" id="btn-next" aria-label="다음 슬라이드">
      &#8594;
    </button>
    <div class="dot-nav" id="dot-nav"></div>
    <div class="slide-counter">
      <span id="cur">1</span> / <span id="tot">1</span>
    </div>

    <div class="slide-deck" id="deck">
      <!-- Slide 1 / 1 — 화면의 세 덩어리 -->
      <article class="slide" data-index="0">
        <header class="slide__header">
          <span class="slide__label">Section 1 · Screen Layout</span>
          <h1 class="slide__title">화면의 <span class="hl">세 덩어리</span></h1>
          <p class="slide__sub">
            처음 켠 화면은 왼쪽·가운데·오른쪽 세 덩어리로 나뉜다
          </p>
        </header>
        <main class="slide__body">
          <div class="grid-3">
            <div class="media-card media-card--gray media-card--tall anim-item">
            <svg class="ui-map ui-map--gray" viewBox="0 0 200 120" aria-hidden="true">
              <rect class="ui-map__frame" x="1" y="1" width="198" height="118" rx="7" />
              <path class="ui-map__bar" d="M1 18 H199" />
              <rect class="ui-map__pane ui-map__pane--on" x="10" y="26" width="46" height="84" rx="4" />
              <rect class="ui-map__pane" x="64" y="26" width="76" height="84" rx="4" />

    <!-- /.slide-deck -->

    <script>
      /* 조작 규칙 (성공 기준):
         페이지 이동은 좌우 nav-btn · 하단 dot · 키보드(←/→/스페이스)로만.
         #deck/body/.slide에 이동용 click 리스너를 절대 달지 않는다 —
         강의 중 화면을 가리키며 클릭해도 슬라이드가 넘어가면 안 된다. */
      class SlidePresentation {
        constructor() {
          this.slides = Array.from(document.querySelectorAll(".slide"));
          this.total = this.slides.length;
          const requested = Number.parseInt(
            new URLSearchParams(window.location.search).get("slide"),
            10,
          );
          this.current =
            Number.isInteger(requested) && requested >= 1 && requested <= this.total
              ? requested - 1
              : 0;
          this.isAnimating = false;
          this._init();
        }
        _init() {
          this.slides.forEach((slide, i) =>
            slide.classList.toggle("active", i === this.current),
          );
          document.getElementById("tot").textContent = this.total;
          this._buildDots();
          this._bindKeys();
          this._bindButtons();
          this._update();
          this._runSlide(this.current);
        }
        /* 슬라이드 진입 시 .anim-item 을 순차 등장시킨다.
           스토리보드의 "애니메이션 순서" = DOM 순서 */
        _runSlide(i) {
          const items = this.slides[i].querySelectorAll(".anim-item");
          items.forEach((el) => {
            el.classList.remove("do-fadeinup");
            void el.offsetWidth; /* reflow — 재진입 시 재생 */
          });
          items.forEach((el, n) => {
            setTimeout(() => el.classList.add("do-fadeinup"), 150 + n * 260);
          });
        }
        next() {
          if (!this.isAnimating) this._go(this.current + 1);
        }
        prev() {
          if (!this.isAnimating) this._go(this.current - 1);
        }
        _go(i) {
          if (
            i < 0 ||
            i >= this.total ||
            i === this.current ||
            this.isAnimating
          )
            return;
          this.isAnimating = true;
          this.slides[this.current].classList.remove("active");
          this.slides[i].classList.add("active");
          this.current = i;
          const url = new URL(window.location.href);
          url.searchParams.set("slide", this.current + 1);
          window.history.replaceState({}, "", url);
          this._runSlide(i);
          setTimeout(() => {
            this.isAnimating = false;
            this._update();
          }, 420);
          this._update();
        }
        _update() {
          const pct = ((this.current + 1) / this.total) * 100;
          document.getElementById("progress").style.width = pct + "%";
          document.getElementById("cur").textContent = this.current + 1;
          document.getElementById("btn-prev").disabled = this.current === 0;
          document.getElementById("btn-next").disabled =
            this.current === this.total - 1;
          document
            .querySelectorAll(".dot")
            .forEach((d, i) =>
              d.classList.toggle("active", i === this.current),
            );
        }
        _buildDots() {
          const nav = document.getElementById("dot-nav");
          this.slides.forEach((_, i) => {
            const b = document.createElement("button");
            b.className = "dot" + (i === 0 ? " active" : "");
            b.setAttribute("aria-label", `슬라이드 ${i + 1}`);
            b.addEventListener("click", () => this._go(i));
            nav.appendChild(b);
          });
        }
        _bindButtons() {
          document
            .getElementById("btn-prev")
            .addEventListener("click", () => this.prev());
          document
            .getElementById("btn-next")
            .addEventListener("click", () => this.next());
        }
        _bindKeys() {
          document.addEventListener("keydown", (e) => {
            if (this.isAnimating) return;
            if (e.key === "ArrowRight" || e.key === " ") {
              e.preventDefault();
              this.next();
            }
            if (e.key === "ArrowLeft") {
              e.preventDefault();
              this.prev();
            }
          });
        }
      }
      new SlidePresentation();
    </script>
