    <title>1인 회사 운영에 유용한 스킬 모음 · Part 4 · 후츠릿</title>
    <!-- TEMPLATE ONLY: 실제 강의 내용·제품명·작업 캡처를 넣지 않는다.
     사용법: 이 파일을 복사 → 필요한 article 선택 → 모든 data-slot/제목/부제 교체.
     diagram의 공통 shape 정의를 유지하거나 사용한 도형만 각 SVG에 펼친다.
     같은 역할은 공통 CSS를 공유한다. 강의 덱의 내용은 소스·스토리보드에서 가져온다. -->
    <link

    <style>
      :root {
        --bg: #0d1117;
        --bg-card: #161b22;
        --text: #e6edf3;
        --text-dim: #8b949e;
        --text-muted: #59636e;
        --brand: #fc1c49;
        --purple: #9188ff;
        --orange: #ff6d3b;
        --yellow: #f0b429;
        --green: #4ade80;
        --gray: #8b949e;
        --border: rgba(255, 255, 255, 0.08);
        --dot: rgba(255, 255, 255, 0.055);
        --title: clamp(2rem, 5.2vw, 3.8rem);
        --statement: clamp(2rem, 3.8vw, 3.7rem);
        --heading: clamp(1.5rem, 2.2vw, 2.25rem);
        --body: clamp(1.1rem, 1.6vw, 1.42rem);
        --gap: clamp(1.5rem, 3vw, 3rem);
        --content-width: 86rem;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        font-family:
          Pretendard,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        font-size: clamp(13px, 1.35vw, 16px);
        background: var(--bg);
        color: var(--text);
        word-break: keep-all;
      }
      body {
        overflow: hidden;
      }
      button {
        font: inherit;
      }
      .slide-deck {
        position: fixed;
        inset: 0;
      }
      .slide {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: clamp(1.5rem, 3.75vh, 3rem);
        padding: clamp(2.6rem, 5.5vh, 4.2rem) clamp(4rem, 7.5vw, 7rem);
        background:
          radial-gradient(circle, var(--dot) 1px, transparent 1px) 0 0/26px 26px,
          var(--bg);
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.36s ease;
      }
      .slide[data-motion="none"]{transition:none}
      .slide.active {
        opacity: 1;
        pointer-events: auto;
      }
      .slide__header {
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
        padding-bottom: clamp(0.9rem, 2.2vh, 1.6rem);
        border-bottom: 1px solid var(--border);
      }
      .slide__label {
        font-size: clamp(0.58rem, 0.85vw, 0.72rem);
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--brand);
      }
      .slide__title {
        font-size: var(--title);
        font-weight: 800;
        line-height: 1.08;
        letter-spacing: -0.015em;
      }
      .slide__sub {
        font-size: clamp(1.05rem, 1.6vw, 1.28rem);
        line-height: 1.5;
        color: var(--text-dim);
      }
      .slide__body {
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: var(--gap);
        overflow: hidden;
        container-type: size;
      }
      .slide__footer {
        border-top: 1px solid var(--border);
        padding-top: clamp(0.5rem, 1.3vh, 0.9rem);
      }
      .fastcampus-logo {
        display: block;
        width: clamp(7.2rem, 9vw, 8.5rem);
        height: auto;
      }
      .hl,
      .tone-brand {
        color: var(--brand);
      }
      .tone-purple {
        color: var(--purple);
      }
      .tone-gray {
        color: var(--gray);
      }
      .tone-yellow {
        color: var(--yellow);
      }
      .tone-orange {
        color: var(--orange);
      }
      .tone-green {
        color: var(--green);
      }
      /* Shared roles: cover and split layouts inherit exactly the same type. */
      .statement {
        font-family: inherit;
        font-size: var(--statement);
        font-weight: 850;
        line-height: 1.35;
        letter-spacing: -0.035em;
      }
      .statement strong {
        display: block;
        color: var(--brand);
        font-weight: 900;
      }
      .heading {
        font-size: var(--heading);
        font-weight: 800;
        line-height: 1.35;
        letter-spacing: -0.025em;
      }
      .copy {
        font-size: var(--body);
        line-height: 1.6;
        color: var(--text-dim);
      }
      .eyebrow {
        font-size: clamp(1rem, 1.5vw, 1.3rem);
        line-height: 1.5;
        color: var(--text-dim);
      }
      .diagram {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
        color: var(--gray);
      }
      .symbols {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .content {
        width: min(100%, var(--content-width));
        margin-inline: auto;
      }
      /* Image slots are borderless. Replace the SVG slot with the clip's image. */
      .scene {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.65fr);
        gap: var(--gap);
        align-items: center;
        width: min(100%, 92rem);
      }
      .scene--visual-first {
        grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
      }
      .scene__copy {
        display: flex;
        flex-direction: column;
        gap: clamp(1.3rem, 3vh, 2.5rem);
      }
      .scene__visual {
        width: 100%;
        height: min(52cqh, 28rem);
        min-height: 15rem;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
      }
      .scene--cover .scene__visual,
      .scene--image .scene__visual {
        height: min(78cqh, 34rem);
      }
      .scene__visual > img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border: 0;
        box-shadow: none;
      }
      .scene__visual > .diagram {
        min-height: 0;
        flex: 1;
      }
      .scene__visual figcaption {
        font-size: var(--body);
        color: var(--text-dim);
        text-align: center;
      }
      /* Open parallel concepts: diagram, heading, caption; no card shells. */
      .triptych {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--gap);
        align-items: start;
      }
      .concept {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: clamp(1rem, 2.6vh, 2rem);
        min-width: 0;
      }
      .concept > .diagram {
        height: clamp(11rem, 25vh, 19rem);
      }
      .concept .copy {
        max-width: 17em;
      }
      /* Optional transition copy, never wrapped in a banner or bordered box. */
      .handoff {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1.25rem;
        color: var(--text-dim);
        font-size: var(--body);
        line-height: 1.5;
      }
      .handoff strong {
        color: var(--text);
        font-weight: 800;
      }
      .progress-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        z-index: 200;
        background: var(--border);
      }
      .progress-fill {
        height: 100%;
        background: var(--brand);
        transition: width 0.3s ease;
      }
      .nav-btn {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        z-index: 150;
        width: clamp(1.9rem, 2.8vw, 2.5rem);
        height: clamp(1.9rem, 2.8vw, 2.5rem);
        display: grid;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.03);
        color: var(--text-dim);
        cursor: pointer;
      }
      .nav-btn:hover:not(:disabled) {
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
      }
      .nav-btn:disabled {
        opacity: 0.1;
        cursor: default;
      }
      #btn-prev {
        left: clamp(0.4rem, 1.2vw, 1.1rem);
      }
      #btn-next {
        right: clamp(0.4rem, 1.2vw, 1.1rem);
      }
      .dot-nav {
        position: fixed;
        bottom: 1.3rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 5px;
        z-index: 150;
      }
      .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        border: 0;
        cursor: pointer;
        transition: all 0.22s ease;
      }
      .dot.active {
        width: 22px;
        border-radius: 3px;
        background: var(--brand);
      }
      .slide-counter {
        position: fixed;
        bottom: 1.2rem;
        right: 1.8rem;
        font:
          0.62rem Monaco,
          monospace;
        color: var(--text-muted);
        z-index: 150;
      }
      @keyframes s-fadeInUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .anim-item {
        opacity: 0;
      }
      .anim-item.do-fadeinup {
        animation: s-fadeInUp 0.48s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @media (prefers-reduced-motion: reduce) {
        .slide,
        .progress-fill {
          transition: none;
        }
        .anim-item.do-fadeinup {
          animation-duration: 0.001s;
        }
      }

      .status-one-line {
        white-space: nowrap;
        max-width: none;
      }

      /* STRUCTURE_BRANCH: root and children are content, connecting lines encode membership. */
      .structure-tree {
        width: min(100%, 72rem);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .structure-node {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        text-align: center;
        min-width: 0;
      }
      .structure-node > .diagram {
        width: 6rem;
        height: 6rem;
      }
      .structure-tree__root {
        display: flex;
        align-items: center;
        gap: 1.5rem;
      }
      .structure-tree__root > .diagram {
        width: 5rem;
        height: 5rem;
      }
      .structure-tree__stem {
        height: 3rem;
        border-left: 2px solid var(--gray);
      }
      .structure-tree__children {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 100%;
        position: relative;
      }
      .structure-tree__children::before {
        content: "";
        position: absolute;
        top: 0;
        left: 25%;
        right: 25%;
        border-top: 2px solid var(--gray);
      }
      .structure-tree__children > .structure-node {
        position: relative;
        padding: 3rem 1.5rem 0;
      }
      .structure-tree__children > .structure-node::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 0;
        height: 2rem;
        border-left: 2px solid var(--gray);
      }
      .structure-tree__root .copy {
        margin-top: 0.45rem;
      }
      /* STRUCTURE_EXCHANGE: only the common scope gets a boundary, not every text node. */
      .exchange {
        position: relative;
        aspect-ratio: 600/430;
        width: 100%;
        border: 1px solid var(--gray);
        border-radius: 0.5rem;
      }
      .exchange__scope {
        position: absolute;
        top: 1rem;
        left: 1.25rem;
      }
      .exchange > .diagram {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .exchange__node {
        position: absolute;
        width: 43%;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
      }
      .exchange__node--root {
        top: 14%;
        left: 28.5%;
      }
      .exchange__node--a {
        bottom: 9%;
        left: 3.5%;
      }
      .exchange__node--b {
        bottom: 9%;
        right: 3.5%;
      }
      .exchange__legend {
        position: absolute;
        top: 46%;
        left: 37%;
        width: 26%;
        display: grid;
        gap: 0.7rem;
        text-align: center;
      }
      .exchange__legend .copy {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }
      .line-key {
        width: 1.5rem;
        border-top: 2px solid var(--yellow);
      }
      .line-key--return {
        border-top-style: dashed;
      }
      /* TRANSITION_COMPARE: mirror all four rows; the center is a transition arrow only. */
      .transition-compare {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 4rem minmax(0, 1fr);
        align-items: center;
        gap: 2.5rem;
        width: min(100%, var(--content-width));
      }
      .transition-side {
        display: grid;
        grid-template-rows: 2rem 5.5rem 12rem minmax(3.2rem, auto);
        align-items: center;
        justify-items: center;
        text-align: center;
        gap: 1rem;
        min-width: 0;
      }
      .transition-side > .diagram {
        height: 12rem;
        width: 100%;
      }
      .transition-side > .copy {
        max-width: 20em;
      }
      .transition-compare__arrow {
        height: 4rem;
      }

/* Animate the semantic boundary separately; never hide or move its children as a group. */
.motion-scope{position:relative;border-color:transparent!important}
.motion-scope>.scope-frame{position:absolute;inset:-1.5px;display:block;border:1.5px solid var(--gray);border-radius:inherit;pointer-events:none}
.motion-scope>.scope-frame.anim-item.do-fadeinup,.scope-caption.anim-item.do-fadeinup{animation-name:scope-fade;animation-duration:.48s;animation-timing-function:cubic-bezier(.23,1,.32,1);animation-fill-mode:both;transform:none}
@keyframes scope-fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.motion-scope>.scope-frame.anim-item,.scope-caption.anim-item{opacity:1;animation:none!important;transform:none}}

      /* CONTAINED_STRUCTURE: a semantic scope, followed by independently revealed contents. */
      .scope-panel{width:min(100%,78rem);border:1.5px solid var(--gray);border-radius:.7rem;padding:2rem 2.4rem}
      .scope-panel__header{display:flex;align-items:baseline;gap:1.6rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
      .scope-panel__content{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr);gap:2rem;padding-top:1.6rem}
      .scope-panel__items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.5rem;margin-top:1.5rem}
      .scope-panel__item,.scope-panel__shared{display:flex;flex-direction:column;align-items:center;gap:.8rem;text-align:center}
      .scope-panel__item .diagram{width:6rem;height:7rem}
      .scope-panel__shared{border-left:1px solid var(--border);padding-left:1.5rem}
      .scope-panel__shared .diagram{width:7rem;height:8rem}
      .scope-panel .anim-item.do-fadeinup{animation-name:scope-fade}
      [data-motion="none"] .anim-item{opacity:1;animation:none!important}
      @media(max-height:650px){.scope-panel{padding:1.2rem}.scope-panel__header{padding-bottom:1rem}.scope-panel__content{gap:1.2rem;padding-top:1rem}.scope-panel__items{gap:1rem;margin-top:1rem}.scope-panel__item .diagram{width:4rem;height:5rem}.scope-panel__shared .diagram{width:5rem;height:6rem}}

/* Chapter 3: diagrams inherit the shared slide typography and colors. */
.skill-stage {width:min(100%,var(--content-width));margin-inline:auto;}
.skill-stage p,.skill-stage h2,.skill-stage h3 {margin:0;}

.skill-art {width:8rem;height:8rem;display:block;margin:auto;overflow:visible;}
.skill-art--large {width:13rem;height:13rem;}
.skill-art--small {width:5rem;height:5rem;}
.skill-art--inline {width:3rem;height:3rem;}
.tone-result{color:var(--green)}
.skill-paper {border:2px solid var(--border);background:var(--bg-card);padding:1.5rem 1.6rem;position:relative;min-width:0;}
.skill-paper .heading {font-size:var(--heading);}
.skill-paper p + p,.skill-paper h2 + p {margin-top:.8rem;}
.skill-paper--method{border-color:var(--brand)}

.skill-arrow {display:flex;align-items:center;justify-content:center;width:100%;max-width:3.5rem;height:1.25rem;justify-self:center;align-self:center;color:var(--gray);}
.connector-art {display:block;width:100%;height:100%;overflow:visible;flex:none;}
.skill-arrow.vertical{width:1.25rem;height:2.5rem;min-width:0;margin:.5rem auto .75rem;}
.skill-caption {font-size:var(--body);line-height:1.5;color:var(--text-dim);text-align:center;}
.skill-eyebrow {font-size:1.05rem;color:var(--text-dim);font-weight:700;letter-spacing:.05em;}





.skill-agent {text-align:center;}
.skill-agent .heading {margin-top:.7rem;}
.skill-agent .copy {margin-top:.6rem;}
.skill-split {display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:stretch;}

.skill-list {display:flex;flex-direction:column;gap:1.1rem;margin-top:1.5rem;}

.skill-flow .skill-guide{grid-column:3;grid-row:1;text-align:center;}

.skill-guide .copy {font-size:1.1rem;}
.skill-guide > .skill-caption {margin:.45rem 0;}
.skill-flow .flow-row {grid-row:2;}
.skill-plugin {position:relative;padding:2.5rem 3rem;}
.skill-plugin .scope-frame {inset:0;border-color:var(--gray);border-radius:.7rem;}
.skill-plugin-header{display:flex;justify-content:space-between;align-items:baseline;position:relative;margin-bottom:2.5rem;}

.skill-output-pair .skill-paper{max-width:20rem;margin:auto;min-height:14rem;display:flex;flex-direction:column;justify-content:center;gap:1.4rem;color:var(--green);}

.skill-output-pair .heading{margin-top:1.5rem;}
.skill-find .heading{margin:1rem 0;}
.skill-find .skill-tag{margin:0 0 1rem;}
.skill-find .skill-art {width:8rem;height:8rem;}
.skill-handoff {display:grid;grid-template-columns:1.2fr 4rem 1fr 4rem 1fr;gap:1.5rem;align-items:center;}
.skill-handoff-docs {display:flex;flex-direction:column;gap:1rem;}

.skill-handoff-docs .heading {font-size:var(--heading);}

@media (max-width:1400px){

    <script>
      // file:// 로 열었을 때만 경로를 보정한다. 정식 덱과 같은 코드다 —
      // 이 템플릿을 복사해 만든 덱이 그대로 동작해야 한다. HTTP 경로에는 개입하지 않는다.
      (function () {
        if (location.protocol !== "file:") return;
        // 정식 덱은 경로의 /artifacts/ 앞이 저장소 루트다.
        // 스킬 assets 안의 템플릿처럼 /artifacts/ 밖에 있는 파일은 깊이로 되짚는다.
        var m = location.pathname.match(/^(.*\/)artifacts\//);
        var root = m
          ? m[1]
          : new URL(
              /\/\.(claude|agents)\/skills\/fastcampus-slide\/assets\//.test(
                location.pathname,
              )
                ? "../../../../"
                : "../../../",
              location.href,
            ).pathname;
        function apply() {
          document.querySelectorAll('img[src^="/"]').forEach(function (el) {
            var s = el.getAttribute("src");
            if (s.indexOf(root) === 0) return;
            el.setAttribute("src", root + s.slice(1));
          });
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", apply);
        } else {
          apply();
        }
      })();
      /* 조작 규칙 (성공 기준):
         페이지 이동은 좌우 nav-btn · 하단 dot · 키보드(←/→/스페이스)로만.
         #deck/body/.slide에 이동용 click 리스너를 절대 달지 않는다 —
         강의 중 화면을 가리키며 클릭해도 슬라이드가 넘어가면 안 된다. */
// A connector uses visible icon bounds; labels are not endpoint anchors.
function drawPatternConnections(){
 document.querySelectorAll('.tx-graph').forEach(graph=>{
  const svg=graph.querySelector('.tx-wires');const rect=graph.getBoundingClientRect();
  if(!rect.width||!rect.height)return;
  svg.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);
  const anchor=(node)=>{const r=node.querySelector('.tx-art').getBoundingClientRect();return {x:r.x-rect.x+r.width/2,y:r.y-rect.y+r.height/2,w:r.width,h:r.height}};
  graph.querySelectorAll('.tx-link').forEach(link=>{
   const f=graph.querySelector(`[data-node="${link.dataset.from}"]`),t=graph.querySelector(`[data-node="${link.dataset.to}"]`);if(!f||!t)return;
   const a=anchor(f),b=anchor(t),route=link.dataset.route||'',path=link.querySelector('path');let d;const gap=12;
   if(route.includes('tree')){const y=(a.y+a.h*.3+b.y-b.h*.3)/2;d=`M${a.x} ${a.y+a.h*.32+gap}V${y}H${b.x}V${b.y-b.h*.32-gap}`;}
   else if(route.includes('return')){const fromBottom=f.getBoundingClientRect().bottom-rect.y+gap,toBottom=t.getBoundingClientRect().bottom-rect.y+gap,y=Math.min(rect.height*.9,Math.max(fromBottom,toBottom)+25);d=`M${a.x} ${fromBottom}V${y}H${b.x}V${toBottom}`;}
   else if(Math.abs(b.y-a.y)>rect.height*.26&&graph.classList.contains('tx-delegation')){const x1=a.x+(b.x<a.x?-15:15),y1=a.y+a.h*.4+gap,x2=b.x,y2=b.y-b.h*.4-gap;d=`M${x1} ${y1}C${x1} ${(y1+y2)/2} ${x2} ${(y1+y2)/2} ${x2} ${y2}`;}
   else{const sign=b.x>a.x?1:-1,x1=a.x+sign*(a.w*.4+gap),x2=b.x-sign*(b.w*.4+gap);d=route.includes('curve')||Math.abs(b.y-a.y)>20?`M${x1} ${a.y}C${x1+(x2-x1)*.55} ${a.y} ${x2-(x2-x1)*.35} ${b.y} ${x2} ${b.y}`:`M${x1} ${a.y}L${x2} ${b.y}`;}
   path.setAttribute('d',d);if(route.includes('draw'))path.setAttribute('pathLength','1');
  });
 });
}
const patternObserver=new ResizeObserver(()=>requestAnimationFrame(drawPatternConnections));
document.querySelectorAll('.tx-graph').forEach(e=>patternObserver.observe(e));
document.fonts.ready.then(drawPatternConnections);
function selectPatternPanel(root,id){
 root.querySelectorAll('[data-panel]').forEach(b=>{const active=b.dataset.panel===id;b.setAttribute('aria-selected',active);b.tabIndex=active?0:-1;});
 root.querySelectorAll('[data-panel-view]').forEach(p=>{const active=p.dataset.panelView===id;p.classList.toggle('active',active);p.setAttribute('aria-hidden',!active);p.inert=!active;});
}
document.querySelectorAll('.tx-switch').forEach((root,n)=>{
 root.querySelectorAll('[data-panel]').forEach(button=>{
  const id=button.dataset.panel;button.id=`tx-tab-${n}-${id}`;button.setAttribute('aria-controls',`tx-panel-${n}-${id}`);
  const panel=root.querySelector(`[data-panel-view="${id}"]`);panel.id=`tx-panel-${n}-${id}`;panel.setAttribute('aria-labelledby',button.id);
  button.addEventListener('click',()=>selectPatternPanel(root,id));
  button.addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;event.preventDefault();event.stopPropagation();const buttons=[...root.querySelectorAll('[data-panel]')],next=buttons[(buttons.indexOf(button)+(event.key==='ArrowLeft'||event.key==='ArrowUp'?-1:1)+buttons.length)%buttons.length];next.focus();selectPatternPanel(root,next.dataset.panel);});
 });selectPatternPanel(root,root.dataset.defaultPanel);
});
document.querySelectorAll('.tx-time-car').forEach(car=>{
 const root=car.closest('.tx-time');const run=e=>{e.preventDefault();e.stopPropagation();root.classList.remove('is-running');void root.offsetWidth;root.classList.add('is-running');};
 car.addEventListener('pointerdown',e=>e.preventDefault());car.addEventListener('click',run);car.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')run(e);});
});
function resetPatternInteractions(slide){
 slide.querySelectorAll('.tx-time').forEach(e=>e.classList.remove('is-running'));
 slide.querySelectorAll('.tx-switch').forEach(e=>selectPatternPanel(e,e.dataset.defaultPanel));
 requestAnimationFrame(drawPatternConnections);
}

      class SlidePresentation {
        constructor() {
          this.slides = Array.from(document.querySelectorAll(".slide"));
          this.total = this.slides.length;
          const requested = Number.parseInt(
            new URLSearchParams(window.location.search).get("slide"),
            10,
          );
          this.current =
            Number.isInteger(requested) &&
            requested >= 1 &&
            requested <= this.total
              ? requested - 1
              : 0;
          this.isAnimating = false;
          this._init();
        }
        _init() {
          this.slides.forEach((slide, i) =>
            slide.classList.toggle("active", i === this.current),
          );
          document.getElementById("tot").textContent = this.total;
          this._buildDots();
          this._bindKeys();
          this._bindButtons();
          this._update();
          this._runSlide(this.current);
        }
        /* 슬라이드 진입 시 .anim-item 을 순차 등장시킨다.
           스토리보드의 "애니메이션 순서" = DOM 순서 */
        _runSlide(i) {
          const slide = this.slides[i];
          resetPatternInteractions(slide);
          const items = [...slide.querySelectorAll('.anim-item')];
          items.forEach(el => el.classList.remove('do-fadeinup'));
          void slide.offsetWidth;
          const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
          const instant = reduced || slide.dataset.motion === 'none';
          items.forEach((el,n) => {
            const requested = Number(el.dataset.animStep ?? n);
            const step = Number.isFinite(requested) ? Math.max(0, requested) : n;
            el.style.animationDelay = instant ? '0ms' : `${150 + step * 260}ms`;
            el.style.setProperty('--draw-delay',el.style.animationDelay);
            el.classList.add('do-fadeinup');
          });
        }
        next() {
          if (!this.isAnimating) this._go(this.current + 1);
        }
        prev() {
          if (!this.isAnimating) this._go(this.current - 1);
        }
        _go(i) {
          if (
            i < 0 ||
            i >= this.total ||
            i === this.current ||
            this.isAnimating
          )
            return;
          this.isAnimating = true;
          this.slides[this.current].classList.remove("active");
          this.slides[i].classList.add("active");
          this.current = i;
          const url = new URL(window.location.href);
          url.searchParams.set("slide", this.current + 1);
          window.history.replaceState({}, "", url);
          this._runSlide(i);
          setTimeout(() => {
            this.isAnimating = false;
            this._update();
          }, 420);
          this._update();
        }
        _update() {
          this.slides.forEach((slide, i) => {
            slide.inert = i !== this.current;
            slide.setAttribute('aria-hidden', String(i !== this.current));
          });
          const pct = ((this.current + 1) / this.total) * 100;
          document.getElementById("progress").style.width = pct + "%";
          document.getElementById("cur").textContent = this.current + 1;
          document.getElementById("btn-prev").disabled = this.current === 0;
          document.getElementById("btn-next").disabled =
            this.current === this.total - 1;
          document
            .querySelectorAll(".dot")
            .forEach((d, i) =>
              d.classList.toggle("active", i === this.current),
            );
        }
        _buildDots() {
          const nav = document.getElementById("dot-nav");
          this.slides.forEach((_, i) => {
            const b = document.createElement("button");
            b.className = "dot" + (i === 0 ? " active" : "");
            b.setAttribute("aria-label", `슬라이드 ${i + 1}`);
            b.addEventListener("click", () => this._go(i));
            nav.appendChild(b);
          });
        }
        _bindButtons() {
          document
            .getElementById("btn-prev")
            .addEventListener("click", () => this.prev());
          document
            .getElementById("btn-next")
            .addEventListener("click", () => this.next());
        }
        _bindKeys() {
          document.addEventListener("keydown", (e) => {
            if (e.target.closest(".tx-switch, .tx-time-car")) return;
            if (this.isAnimating) return;
            if (e.key === "ArrowRight" || e.key === " ") {
              e.preventDefault();
              this.next();
            }
            if (e.key === "ArrowLeft") {
              e.preventDefault();
              this.prev();
            }
          });
        }
      }
      const presentation = new SlidePresentation();
      window.addEventListener('popstate', () => {
        const n = Number.parseInt(new URLSearchParams(location.search).get('slide'), 10);
        const i = Number.isInteger(n) && n >= 1 && n <= presentation.total ? n - 1 : 0;
        presentation.isAnimating = false;
        presentation.slides.forEach((s,k) => s.classList.toggle('active', k === i));
        presentation.current = i;
        presentation._runSlide(i);
        presentation._update();
      });
    </script>
